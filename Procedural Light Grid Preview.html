<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Procedural Light Grid Preview</title>
<style>
:root{--bg:#f1f4f9;--fg:#18202f;--mut:#566178;--bd:#cdd5e2;--btn:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0d15;--fg:#e4e9f4;--mut:#8b97b0;--bd:#222d44;--btn:#121a2b}}
:root[data-theme="dark"]{--bg:#0a0d15;--fg:#e4e9f4;--mut:#8b97b0;--bd:#222d44;--btn:#121a2b}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px}
h1{font-size:15px;margin:0;font-weight:600}
.btns{display:flex;gap:8px}
button{background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button[aria-pressed="true"]{border-color:#2fc8ff;color:#2fc8ff}
#wrap{position:relative;flex:1;min-height:320px;margin:0 14px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#05060d}
canvas{position:absolute;inset:0;display:block;touch-action:none;cursor:crosshair}
footer{padding:8px 14px 12px;color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>Procedural background + reactive light grid</h1>
  <div class="btns"><button id="bw">Shockwave</button><button id="bd" aria-pressed="true">Auto demo</button></div>
</header>
<div id="wrap"><canvas id="c"></canvas></div>
<footer>WASD / arrows fly · move the pointer to aim · hold click to fire · space or right-click for a shockwave. Idle for a few seconds and the demo takes over.</footer>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),TAU=Math.PI*2;
let W=0,H=0,cx=0,cy=0;
function resize(){const r=cv.parentElement.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cx=W/2;cy=H/2;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();

function h(x,y,s){let a=Math.imul(x,0x9E3779B1)^Math.imul(y,0x85EBCA77)^Math.imul(s,0xC2B2AE3D);a^=a>>>15;a=Math.imul(a,0x2C1B3C6D);a^=a>>>12;a=Math.imul(a,0x297A2D39);a^=a>>>15;return(a>>>0)/4294967295}

const cam={x:0,y:0},vel={x:0,y:0},keys={},ptr={x:0,y:0,down:false};
let t=0,angle=0,cool=0,shake=0,lastInput=-99,demo=true,demoOn=true,demoFire=0,demoBlast=3;
const bullets=[],impacts=[],sparks=[];
const GP=0.6,C=20; // grid parallax + cell size

function toGrid(rx,ry){return[rx+cam.x*GP,ry+cam.y*GP]} // screen-relative -> grid space
function impact(rx,ry,amp,sp){const[g,k]=toGrid(rx,ry);impacts.push({gx:g,gy:k,t0:t,amp,sp});if(impacts.length>24)impacts.shift()}
function burst(rx,ry,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=80+Math.random()*260;sparks.push({x:cam.x+rx,y:cam.y+ry,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.35+Math.random()*.3,m:.65})}}
function fire(){
  const dx=Math.cos(angle),dy=Math.sin(angle);
  bullets.push({rx:dx*22,ry:dy*22,vx:dx*950+vel.x*.5,vy:dy*950+vel.y*.5,life:.55+Math.random()*.15,wx:cam.x,wy:cam.y});
  impact(dx*22,dy*22,.28,260);
  vel.x-=dx*14;vel.y-=dy*14;
}
function blast(){impact(0,0,1.7,820);burst(0,0,26);shake=1}
function touchInput(){lastInput=t;demo=false;setPressed()}
function setPressed(){document.getElementById('bd').setAttribute('aria-pressed',demoOn?'true':'false')}

addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space'){e.preventDefault();touchInput();blast()}else if(/^(Key[WASD]|Arrow)/.test(e.code)){e.preventDefault();touchInput()}});
addEventListener('keyup',e=>{keys[e.code]=0});
function setPtr(e){const r=cv.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top}
cv.addEventListener('pointermove',e=>{setPtr(e);if(e.pointerType==='mouse'&&!ptr.down)lastInput=t});
cv.addEventListener('pointerdown',e=>{setPtr(e);if(e.button===2){blast();touchInput();return}ptr.down=true;touchInput();cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>{ptr.down=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('bw').onclick=()=>{blast()};
document.getElementById('bd').onclick=()=>{demoOn=!demoOn;demo=demoOn;lastInput=t;setPressed()};

function update(dt){
  t+=dt;
  if(demoOn&&!demo&&t-lastInput>6&&!ptr.down)demo=true;
  let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(dx||dy){const l=Math.hypot(dx,dy);vel.x+=dx/l*1400*dt;vel.y+=dy/l*1400*dt;const s=Math.hypot(vel.x,vel.y);if(s>1500){vel.x*=1500/s;vel.y*=1500/s}const f=Math.exp(-.35*dt);vel.x*=f;vel.y*=f}
  else{const k=1-Math.exp(-.8*dt),tx=Math.cos(t*.13)*90,ty=Math.sin(t*.09)*90;vel.x+=(tx-vel.x)*k;vel.y+=(ty-vel.y)*k}
  cam.x+=vel.x*dt;cam.y+=vel.y*dt;

  let target=angle;
  if(demo){target=t*1.3+Math.sin(t*.7)*1.5}else if(ptr.x||ptr.y){target=Math.atan2(ptr.y-cy,ptr.x-cx)}
  const d=((target-angle+Math.PI)%TAU+TAU)%TAU-Math.PI;angle+=d*(1-Math.exp(-14*dt));

  cool-=dt;
  const shooting=demo?(demoFire-=dt)<0&&(demoFire=.1+Math.random()*.1,true):ptr.down;
  if(shooting&&cool<=0){fire();cool=.09}
  if(demo&&(demoBlast-=dt)<0){demoBlast=2.5+Math.random()*2;blast()}

  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.rx+=(b.vx-(cam.x-b.wx)/Math.max(dt,1e-3)*0)*dt;b.ry+=b.vy*dt;b.rx-=vel.x*dt;b.ry-=vel.y*dt;b.life-=dt;
    if(b.life<=0){impact(b.rx,b.ry,1,430);burst(b.rx,b.ry,8);shake=Math.max(shake,.25);bullets.splice(i,1)}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.96;s.vy*=.96;s.l-=dt;if(s.l<=0)sparks.splice(i,1)}
  for(let i=impacts.length-1;i>=0;i--)if(t-impacts[i].t0>2.6)impacts.splice(i,1);
  shake*=Math.exp(-7*dt);
}

function ring(x,y,r,n,rot){ctx.beginPath();for(let k=0;k<=n;k++){const a=rot+TAU*k/n,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()}
function cells(par,cell,m,fn){const ox=cam.x*par,oy=cam.y*par;
  for(let j=Math.floor((oy-cy-m)/cell);j<=Math.ceil((oy+cy+m)/cell);j++)for(let i=Math.floor((ox-cx-m)/cell);i<=Math.ceil((ox+cx+m)/cell);i++)fn(i,j,i*cell-ox+cx,j*cell-oy+cy)}
const vig=(x,y)=>Math.max(0,Math.min(1,1.25-Math.hypot((x-cx)/cx,(y-cy)/cy)));

function nebula(){ctx.lineWidth=1.5;cells(.1,700,500,(i,j,ox,oy)=>{if(h(i,j,0)>.55)return;
  const x=ox+h(i,j,1)*700,y=oy+h(i,j,2)*700,hue=200+h(i,j,3)*120+t*5,base=220+h(i,j,4)*260,ph=h(i,j,5)*TAU,br=1+.08*Math.sin(t*.5+ph);
  for(let k=0;k<7;k++){const f=(k+1)/7;ctx.strokeStyle=`hsla(${hue+f*40},75%,50%,${(.03+.2*(1-f)*(1-f)).toFixed(3)})`;ctx.beginPath();
    for(let n=0;n<=56;n++){const a=TAU*n/56,w=Math.sin(a*3+t*.6+ph+k*.4)+.5*Math.sin(a*5-t*.9+ph*2+k*.8),r=base*f*br+w*(6+10*f);n?ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.stroke()}})}

function stars(par,cell,seed){ctx.lineWidth=1;cells(par,cell,40,(i,j,ox,oy)=>{if(h(i,j,seed*100)>.6)return;
  const x=ox+h(i,j,seed*100+1)*cell,y=oy+h(i,j,seed*100+2)*cell,r3=h(i,j,seed*100+3),tw=.55+.45*Math.sin(t*(1+3*r3)+r3*TAU),a=Math.min(1,(.25+.6*par)*tw*Math.max(.25,vig(x,y)));
  ctx.strokeStyle=`hsla(${190+r3*90},35%,85%,${a.toFixed(3)})`;const sx=-vel.x*.02*par,sy=-vel.y*.02*par,s=(1+2*par)*(.6+.4*tw);
  ctx.beginPath();if(Math.hypot(sx,sy)>2){ctx.moveTo(x,y);ctx.lineTo(x+sx,y+sy)}ctx.moveTo(x-s,y);ctx.lineTo(x+s,y);ctx.moveTo(x,y-s);ctx.lineTo(x,y+s);ctx.stroke()})}

function grid(){
  const ox=cam.x*GP,oy=cam.y*GP,i0=Math.floor((ox-cx)/C)-1,i1=Math.ceil((ox+cx)/C)+1,j0=Math.floor((oy-cy)/C)-1,j1=Math.ceil((oy+cy)/C)+1;
  const im=impacts.map(o=>({x:o.gx-ox+cx,y:o.gy-oy+cy,age:t-o.t0,amp:o.amp,sp:o.sp}));
  const bs=bullets.map(b=>({x:b.rx+cx,y:b.ry+cy}));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const sx=i*C-ox+cx+C/2,sy=j*C-oy+cy+C/2,v=vig(sx,sy);if(v<=0)continue;
    let e=.04*Math.max(0,Math.sin(i*.3+j*.18-t*1.3)),px=0,py=0;
    const r=h(i,j,5);if(r>.965)e+=.22*(.5+.5*Math.sin(t*3+r*60));
    for(const o of im){const dx=sx-o.x,dy=sy-o.y,d=Math.hypot(dx,dy),dl=d-o.age*o.sp,wd=26+o.age*18,w=Math.exp(-dl*dl/(2*wd*wd))*Math.exp(-o.age*2.3)*o.amp;
      e+=w+Math.exp(-d*d/1100)*Math.exp(-o.age*9)*o.amp;if(d>.5){px+=dx/d*w*4;py+=dy/d*w*4}}
    for(const b of bs){const dx=sx-b.x,dy=sy-b.y;e+=Math.exp(-(dx*dx+dy*dy)/1500)*.95}
    {const dx=sx-cx,dy=sy-cy;e+=.22*Math.exp(-(dx*dx+dy*dy)/9000)}
    const em=Math.min(e,1.4),s=C-4+Math.min(em,1)*3,a=Math.min(1,(.09+.9*Math.min(e,1)))*v;
    ctx.fillStyle=`hsla(${195+em*75},90%,${42+Math.min(em,1)*38}%,${a.toFixed(3)})`;
    ctx.fillRect(sx+px-s/2,sy+py-s/2,s,s)}
}

function drifters(){const par=.85;ctx.lineWidth=1.5;cells(par,280,120,(i,j,ox,oy)=>{if(h(i,j,11)>.5)return;
  const x=ox+h(i,j,12)*280,y=oy+h(i,j,13)*280,ph=h(i,j,14)*TAU,sz=18+h(i,j,15)*30,hue=280+h(i,j,16)*110+t*8,v=vig(x,y);if(v<=0)return;
  const col=(dh,a)=>`hsla(${hue+dh},90%,62%,${(a*v).toFixed(3)})`;
  switch(Math.floor(h(i,j,17)*4)){
    case 0:{const p=(t*.35+ph)%1;ctx.strokeStyle=col(0,(1-p)*.7);ring(x,y,p*sz*3.5,40,0);ctx.strokeStyle=col(0,.8);ring(x,y,3,6,t);break}
    case 1:ctx.strokeStyle=col(0,.55);ring(x,y,sz,3,t*.5+ph);ctx.strokeStyle=col(40,.55);ring(x,y,sz,3,-t*.5+ph+Math.PI);break;
    case 2:{const r=sz*(1+.2*Math.sin(t*2+ph));ctx.strokeStyle=col(0,.6);ring(x,y,r,4,Math.PI/4);ctx.strokeStyle=col(30,.5);ring(x,y,r*.5,4,Math.PI/4+t);break}
    default:ctx.strokeStyle=col(0,.8);ring(x,y,5,6,t);ctx.strokeStyle=col(0,.15);ring(x,y,sz,32,0);
      for(let k=0;k<3;k++){const a=t*(.6+k*.25)+ph+k*TAU/3;ctx.strokeStyle=col(50,.8);ring(x+Math.cos(a)*sz,y+Math.sin(a)*sz,3,4,a)}}})}

function projectiles(){
  ctx.lineCap='round';
  for(const b of bullets){const m=Math.hypot(b.vx,b.vy),tx=b.vx/m,ty=b.vy/m,x=b.rx+cx,y=b.ry+cy;
    ctx.lineWidth=3;ctx.strokeStyle='rgba(120,230,255,.9)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-tx*26,y-ty*26);ctx.stroke();
    ctx.lineWidth=1.5;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-tx*10,y-ty*10);ctx.stroke()}
  ctx.lineWidth=1.5;for(const s of sparks){const x=s.x-cam.x+cx,y=s.y-cam.y+cy,a=Math.max(0,s.l/s.m);ctx.strokeStyle=`rgba(255,${180+a*70|0},120,${a.toFixed(2)})`;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s.vx*.03,y-s.vy*.03);ctx.stroke()}
}

function ship(){
  const sp=Math.hypot(vel.x,vel.y),rot=(x,y)=>[cx+x*Math.cos(angle)-y*Math.sin(angle),cy+x*Math.sin(angle)+y*Math.cos(angle)];
  ctx.lineJoin='round';ctx.lineWidth=2;ctx.strokeStyle='#e8f4ff';ctx.beginPath();
  [[18,0],[-12,10],[-7,0],[-12,-10],[18,0]].forEach(([x,y],k)=>{const p=rot(x,y);k?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.stroke();
  const fl=Math.max(2,Math.min(40,sp*.04))*(.8+.2*Math.sin(t*60));ctx.strokeStyle='#ff9a3a';ctx.beginPath();ctx.moveTo(...rot(-8,0));ctx.lineTo(...rot(-8-fl,0));ctx.stroke();
  ctx.lineWidth=1;ctx.strokeStyle='rgba(130,200,255,.25)';ring(cx,cy,24+2*Math.sin(t*3),24,0)}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);
  ctx.globalCompositeOperation='source-over';ctx.fillStyle='#05060d';ctx.fillRect(0,0,W,H);
  ctx.save();if(shake>.01)ctx.translate((Math.random()-.5)*shake*10,(Math.random()-.5)*shake*10);
  ctx.globalCompositeOperation='lighter';
  nebula();stars(.2,70,1);grid();stars(.55,110,2);drifters();projectiles();
  ctx.globalCompositeOperation='source-over';ship();ctx.restore();
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
